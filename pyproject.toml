[project]
name = "agentic-bo"
version = "0.1.0"
description = "Agentic Bayesian optimisation benchmark: LLM agents vs classic BO on synthetic and real reaction-optimisation pools"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Roel Bertens" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    # For the real reaction datasets (--dataset buchwald / arylation):
    "pandas>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# LLM agent backends (only the one you use is needed):
gemini = ["google-genai>=1.0"]   # --agent gemini
claude = ["anthropic>=0.40"]     # --agent claude

[dependency-groups]
dev = ["pytest>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_bo"]
