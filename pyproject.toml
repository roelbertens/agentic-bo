[project]
name = "agentic-bo"
version = "0.1.0"
description = "Agentic Bayesian optimisation benchmark: LLM agents vs classic BO on synthetic and real reaction-optimisation pools"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Roel Bertens" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    # For the real reaction datasets (--dataset buchwald / arylation):
    "pandas>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# LLM agent backends (only the one you use is needed):
gemini = ["google-genai>=1.0"]   # --agent gemini
claude = ["anthropic>=0.40"]     # --agent claude
# Structured eval/tracing stack (run_agentic_bo.py --langfuse, scripts/push_to_langfuse.py):
eval = ["langfuse>=3.0"]
# The multi-fidelity experiment's agent framework (run_multi_fidelity.py --agent gemini):
mf = ["pydantic-ai-slim[google]>=1.0"]

[dependency-groups]
dev = ["pytest>=7.0", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datasets", "src/agentic_bo", "src/rl_design", "src/multi_fidelity"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, UP modernisation, B bugbear, SIM simplification
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Scripts and tests insert src/ on sys.path before importing the packages.
"run_agentic_bo.py" = ["E402"]
"run_rl_design.py" = ["E402"]
"run_multi_fidelity.py" = ["E402"]
"scripts/*" = ["E402"]
"tests/**" = ["E402"]
